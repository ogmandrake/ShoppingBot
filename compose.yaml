services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - "C:/tmp/pgadmin-data-shoppingbot:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoppingbot -d shoppingbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  shoppingbot:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY}
    volumes:
      - "./data:/app/data"